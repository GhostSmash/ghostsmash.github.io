<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="rgb(14,12,13)" />
  <title>Smashh</title>
  <meta name="description" content="Smashh (GhostSmash) — links, socials and music." />
  <meta property="og:title" content="Smashh" />
  <meta property="og:description" content="GhostSmash — links, socials and music." />
  <link rel="icon" href="./assets/avatar.jpg" />

  <!-- Font: Onest (has Cyrillic). Non-blocking; falls back to the system font when offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap"
        media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" /></noscript>

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Background: wallpaper + adaptive shade + glow. Colors are derived from the wallpaper by script.js -->
  <div class="bg" aria-hidden="true">
    <div class="bg__img" id="bg-img"></div>
    <div class="bg__shade"></div>
    <div class="bg__glow bg__glow--a"></div>
    <div class="bg__glow bg__glow--b"></div>
  </div>

  <main class="page">
    <div class="stack">

      <!-- ============ Profile ============ -->
      <article class="card profile" aria-labelledby="nick">

        <div class="profile__top">
          <div class="views" id="views" title="Page views">
            <svg class="views__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
            </svg>
            <span class="sr-only">Views:</span>
            <span id="views-count">&mdash;</span>
          </div>
        </div>

        <header class="profile__head">
          <div class="avatar">
            <img src="./assets/avatar.jpg" alt="Smashh avatar" width="512" height="512" decoding="async" />
          </div>
          <h1 class="nick" id="nick">Smashh</h1>
        </header>

        <ul class="tags" aria-label="Also known as">
          <li>GhostSmash</li>
          <li>smashh</li>
          <li>xssmash</li>
          <li>smashhdev</li>
        </ul>

        <hr class="rule" />

        <a class="handle" href="https://t.me/xssmash" target="_blank" rel="noopener noreferrer">@xssmash</a>

        <p class="term" aria-label="Terminal: smashh at localhost runs whoami">
          <span class="term__prompt" aria-hidden="true">[smashh@localhost ~]$</span>
          <span class="term__cmd" aria-hidden="true">whoami</span><span class="term__cursor" aria-hidden="true"></span>
        </p>

        <!-- Icons are the original brand glyphs (Simple Icons) and use currentColor, so they follow the theme accent -->
        <ul class="socials" aria-label="Social links">
          <li>
            <a class="social" href="https://t.me/xssmash" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm4.962 7.224c.1-.002.321.023.465.14a.5.5 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024q-.159.037-5.061 3.345-.72.495-1.302.48c-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789q.04-.324.893-.663 5.247-2.286 6.998-3.014c3.332-1.386 4.025-1.627 4.476-1.635"/></svg>
            </a>
          </li>
          <li>
            <a class="social" href="https://github.com/GhostSmash" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
            </a>
          </li>
          <li>
            <!-- Discord has no profile links by username: this button copies the username
                 (or opens the profile when discord.userId is set in config.js) -->
            <button class="social" id="discord" type="button" data-copy="xssmash" aria-label="Discord: xssmash (tap to copy)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.317 4.37a19.8 19.8 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.3 18.3 0 0 0-5.487 0 13 13 0 0 0-.617-1.25.08.08 0 0 0-.079-.037A19.7 19.7 0 0 0 3.677 4.37a.1.1 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.08.08 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.08.08 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13 13 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10 10 0 0 0 .372-.292.07.07 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.07.07 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.08.08 0 0 0 .084.028 19.8 19.8 0 0 0 6.002-3.03.08.08 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03M8.02 15.33c-1.182 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418m7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418"/></svg>
            </button>
          </li>
          <li>
            <!-- 4PDA is not in the Simple Icons set, so it is drawn as a wordmark (still recolorable) -->
            <a class="social social--word" href="https://4pda.to/forum/index.php?showuser=10297314" target="_blank" rel="noopener noreferrer" aria-label="4PDA profile">
              <span class="wordmark" aria-hidden="true">4PDA</span>
            </a>
          </li>
        </ul>
      </article>

      <!-- ============ Music player ============ -->
      <section class="card player" id="player" aria-label="Music player">
        <div class="player__top">
          <div class="player__title" id="track-title">
            <span class="player__title-inner" id="track-title-inner">Loading&hellip;</span>
          </div>
          <div class="player__nav" id="track-nav" hidden>
            <button class="icon-btn" id="prev" type="button" aria-label="Previous track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h2v14H6zM20 5.5v13a.75.75 0 0 1-1.17.62L9.6 12.62a.75.75 0 0 1 0-1.24l9.23-6.5A.75.75 0 0 1 20 5.5z"/></svg>
            </button>
            <button class="icon-btn" id="next" type="button" aria-label="Next track">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 5h2v14h-2zM4 5.5v13a.75.75 0 0 0 1.17.62l9.23-6.5a.75.75 0 0 0 0-1.24l-9.23-6.5A.75.75 0 0 0 4 5.5z"/></svg>
            </button>
          </div>
        </div>

        <div class="player__row">
          <span class="time" id="t-cur">00:00</span>
          <input class="seek" id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek" disabled />
          <span class="time" id="t-dur">--:--</span>
          <button class="icon-btn icon-btn--play" id="play" type="button" aria-label="Play" disabled>
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.6v14.8a1 1 0 0 0 1.53.85l11.8-7.4a1 1 0 0 0 0-1.7L8.53 3.75A1 1 0 0 0 7 4.6z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2" fill="currentColor"/></svg>
          </button>
        </div>

        <p class="player__hint" id="player-hint" hidden></p>
      </section>

    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Plain scripts only (no modules / fetch for local files) so it runs from file:// -->
  <script src="./config.js" charset="utf-8"></script>
  <script src="./assets/site-data.js" charset="utf-8"></script>
  <script src="./script.js" charset="utf-8"></script>
</body>
</html>
